name: registry-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validator dependencies
        run: pip install pyyaml jsonschema
      - name: Validate registration records (schema + immutability + uniqueness + references)
        run: python scripts/validate_registry.py
      - name: Resolve the legacy catalog record (registration + resolution demo, CR-AM-11 Phase 1 exit)
        run: python scripts/resolve.py dea-catalog-maturity-models --check
