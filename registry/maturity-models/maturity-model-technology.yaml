id: maturity-model-technology
asset_class: assessment
type: maturity-model
name: Technology Maturity Model
description: Technology Maturity Model - capability assessment asset. Assesses stack fitness, technical
  debt, lifecycle management and skill coverage. Scored on the canonical v2 band scheme; level semantics
  carried verbatim from the dea-metamodel v2-beta port. Release 1.1.0 ships a seeded criteria register
  draft (14 criteria, TEC-* permanent IDs) and the operations touchpoint mirror (CR-AM-13 Phase 4).
source:
  organization: Assessment-Models
  repository: maturity-model-technology
release:
  version: 2.0.0
  reference: d8e345fcfa44bae0d83043ac1cff39b231eec7e8
  commit: d8e345fcfa44bae0d83043ac1cff39b231eec7e8
conformsTo:
  contract:
    id: maturity-scale-contract
    version: '1.0'
status: active
compatibility:
  required_axes:
  - scoring
  - vocabulary
  - examples
  - schema
  - runner
  - governance
  declared_axes:
    scoring: 'The model declares its scoring model: a model-owned five-level scale (maturity/scale.yaml)
      scored against the canonical v2 band instance dea:maturity-bands-v2 v1.0.0 (non-linear band widths
      20/25/25/18/12, per-level effort multipliers 1.0-6.0); release 2.0.0 adopts the canonical L-0 Not Assessed + L-1..L-5 renumbering (dea-metamodel #214, adoption pending ratification).'
    vocabulary: 'The model uses the governed OpenDEA vocabulary published in technehub-labs/dea-metamodel;
      dimension and criterion identifiers carry the dea: namespace. Register criterion IDs (TEC-*) are
      permanent benchmarking keys.'
    examples: The model ships a worked scoring example (examples/*.yaml) demonstrating aggregation, canonical
      band resolution and the effort-adjusted value.
    schema: The model declares its structure in model.yaml (CR-AM-11 §15 contract handshake) validated
      against the published model-manifest.schema.json, and its scale in maturity/scale.yaml validated
      against the published maturity-scale.schema.json. Touchpoint declarations live in touchpoints.yaml
      per CR-AM-13 §5.
    runner: The model is executed by python scripts/local_validate.py, run in CI by .github/workflows/local-model-ci.yml
      (Level 1) and the reusable Level 2 contract-conformance workflow from Assessment-Models/assessment-ci.
    governance: 'The model declares lifecycle status, owner and steward in maturity/model/*.yaml, and
      change control in CONTRIBUTING.md with semver: MAJOR for a level or band definition change, MINOR
      for a new dimension or criterion, PATCH for clarifications.'
notes: >-
  The canonical model id is dea:maturity-technology. This is the v2 migration target for the legacy
  v1-alpha technology instrument (dea-assessment-technology), which remains a separate active asset. Level
  semantics are carried verbatim from technehub-labs/dea-metamodel assessment-models/maturity/v2-beta/technology.yaml;
  only the scoring fields differ from the frozen v1-alpha lineage. Scoring is against the canonical v2
  band instance dea:maturity-bands-v2 v1.0.0. Release 1.1.0 (CR-AM-13 Phase 4, 2026-11-19, PR #5, merge
  commit a7a40cd38dc73ba24184ae4cf85692214cf751bb): seeded criteria register (five dimensions, 10
  sub-dimensions, 14 criteria; TEC-* criterion IDs are permanent benchmarking keys; draft-by-design —
  questionnaire and weights remain with the model owners at stable promotion per CR-AM-13 §8) and
  touchpoints.yaml v0.1.0 mirror tp-technology-x-operations feeding operations D5 platform-capability
  evidence (TEC-D5-SD1-C01 <-> OPS-D5-SD1-C01). Release 1.0.0 (commit
  6a0a0d0b3c65606bf2a0bcf478c9189128b2df0a) remains resolvable. Touchpoint declarations remain
  status: draft until maturity-touchpoint-contract publishes in technehub-labs/dea-metamodel (issue #213). Release 2.0.0 (2026-11-22): adopts the canonical scale level renumbering — L-0 Not Assessed + L-1..L-5 per dea-metamodel #214 (breaking; adoption pending canonical ratification), following the autonomous-operations precedent. Mapping: old L0/L-0 -> L-1 .. old L4 -> L-5; band instance dea:maturity-bands-v2 v1.0.0 unchanged (ids, ranges, effort multipliers); historical index values and bands remain valid. Immutable reference: merge of the cr/scale-level-renumbering branch, commit d8e345fcfa44bae0d83043ac1cff39b231eec7e8.
