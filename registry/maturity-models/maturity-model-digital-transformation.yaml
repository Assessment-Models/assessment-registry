description: >-
  Composite maturity model spanning operations, technology and
  services-delivery child models, plus its own dimensions. CR-AM-10 driving
  use case; CR-AM-11 Phase 4 first-model candidate. Scores against the
  OpenDEA EA reference instance (scale + evaluation + Benchmark 2026
  baseline) as its anchor.
