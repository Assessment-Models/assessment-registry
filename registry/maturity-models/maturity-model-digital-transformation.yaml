# Registration record for the Phase 4 first-model candidate (CR-AM-11 section 31).
#
# The first independent, contract-conformant model in the ecosystem: it
# demonstrates all three CI levels on one repository (Level 1 local-model CI,
# Level 2 contract conformance via the reusable assessment-ci workflow,
# Level 3 immutable-reference resolution via the registry).
id: maturity-model-digital-transformation
asset_class: assessment
