id: maturity-model-modernization
asset_class: assessment
type: maturity-model
name: Architecture Modernization Maturity Model
description: 'Architecture Modernization Maturity Model - capability assessment asset. Assesses the capability
  to modernise legacy estates and platforms: strategy, sequencing, execution and technical-debt reduction.
  Scored on the canonical v2 band scheme; level semantics carried verbatim from the dea-metamodel v2-beta
  port.'
source:
  organization: Assessment-Models
  repository: maturity-model-modernization
release:
  version: 2.0.0
  reference: 1e5ae43720706ed1543356c50703426b2a9934a0
  commit: 1e5ae43720706ed1543356c50703426b2a9934a0
conformsTo:
  contract:
    id: maturity-scale-contract
    version: '1.0'
status: active
compatibility:
  required_axes:
  - scoring
  - vocabulary
  - examples
  - schema
  - runner
  - governance
  declared_axes:
    scoring: 'The model declares its scoring model: a criteria catalog (maturity/model/criteria.yaml, 15
      criteria across 4 practice areas with per-criterion weights and observable L0-L4 anchors) aggregated
      by weighted mean (maturity/model/scoring.yaml) against the canonical v2 band instance
      dea:maturity-bands-v2 v1.0.0 (non-linear band widths 20/25/25/18/12, per-level effort multipliers
      1.0-6.0), yielding the band resolution and the effort-adjusted value.'
    vocabulary: 'The model uses the governed OpenDEA vocabulary published in technehub-labs/dea-metamodel;
      dimension and criterion identifiers carry the dea: namespace.'
    examples: The model ships two worked scoring examples (examples/*.yaml) demonstrating catalog-weighted
      aggregation, canonical band resolution and the effort-adjusted value.
    schema: The model declares its structure in model.yaml (CR-AM-11 §15 contract handshake) validated
      against the published model-manifest.schema.json, and its scale in maturity/scale.yaml validated
      against the published maturity-scale.schema.json.
    runner: The model is validated by python scripts/local_validate.py and scored by python scripts/score_assessment.py,
      run in CI by .github/workflows/local-model-ci.yml (Level 1) and the reusable Level 2 contract-conformance
      workflow from Assessment-Models/assessment-ci.
    governance: 'The model declares lifecycle status, owner and steward in maturity/model/*.yaml, and
      change control in CONTRIBUTING.md with semver: MAJOR for a level or band definition change, MINOR
      for a new dimension or criterion, PATCH for clarifications.'
notes: 'The canonical model id is dea:maturity-modernization. This is the v2 migration target for the
  legacy v1-alpha modernisation instrument (dea-assessment-modernization), which remains a separate active
  asset: the legacy record is an assessment instrument, this record is a maturity model. Level semantics
  (characteristics, exit criteria, evidence) are carried verbatim from technehub-labs/dea-metamodel assessment-models/maturity/v2-beta/modernization.yaml;
  only the scoring fields differ from the frozen v1-alpha lineage. Scoring is against the canonical v2
  band instance dea:maturity-bands-v2 v1.0.0. As of 1.1.0 the model carries a criteria catalog (15 criteria
  across 4 practice areas) and a weighted-mean scoring model; scale semantics remain verbatim and the
  canonical bands remain the scoring reference.
  Release 2.0.0 (2026-11-22) adopts the canonical scale level renumbering — L-0 Not Assessed + L-1..L-5 per dea-metamodel #214 (breaking; adoption pending canonical ratification), following the autonomous-operations precedent. Mapping: old L0/L-0 -> L-1 .. old L4 -> L-5; band instance dea:maturity-bands-v2 v1.0.0 unchanged (ids, ranges, effort multipliers); historical index values and bands remain valid. Immutable reference: merge of the cr/scale-level-renumbering branch.
'

