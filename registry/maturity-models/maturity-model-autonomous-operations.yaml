# Registration record for the Autonomous Operations maturity & assessment model.
#
# Phase-6 extraction (CR-AM-11 §26/§31) completed: the dedicated repository
# maturity-model-autonomous-operations carries the criteria register verbatim
# (157/157 vs the frozen catalog bundle — see its docs/RECONCILIATION.md) and is
# the canonical home on v2 bands. The v1-alpha catalog entry is marked superseded_by.
id: maturity-model-autonomous-operations
asset_class: assessment
type: maturity-model
name: Autonomous Operations Maturity Model
description: >-
  Autonomous Operations (AO) maturity and assessment model: the enterprise operating
  model in which value streams are instrumented with AI, data and closed-loop control;
  OODA (Observe-Orient-Decide-Act) closed loops driven by intent/goals shift decision and
  execution burden from humans to machines. Five levels on the canonical v2 bands with
  ambition-driving AO stages (Manual & Reactive, Instrumented & Assisted, Closed-Loop
  Automated, Goal-Driven Autonomy, Self-Improving Ecosystem); AO Autonomy Index 0-100
  scoring with weakest-link gate and effort-adjusted value; 6 dimensions / 32
  sub-dimensions / 157 criteria; assessment method with evidence pack, assessor
  independence and confidence levels.
source:
  organization: Assessment-Models
  repository: maturity-model-autonomous-operations
release:
  version: 2.0.0
  reference: 8ccf747e483d3c1bd82a46d1a5bb09a045a1e81d
  commit: 8ccf747e483d3c1bd82a46d1a5bb09a045a1e81d
conformsTo:
  contract:
    id: maturity-scale-contract
    version: "1.0"
status: active
notes: >-
  The registered model version is 2.0.0 and its release reference and commit
  are the immutable SHA 8ccf747e483d3c1bd82a46d1a5bb09a045a1e81d. This commit
  has been verified to exist. The repository currently has no v2.0.0 Git tag;
  v1.0.1 is a historical tag. The registry therefore records an immutable
  commit reference, but the version-to-tag release convention remains pending.
  The v2 model declares L-0 Not Assessed as an unscored sentinel and L-1..L-5
  as its five capability levels, mapped to the canonical v2 bands. Historical
  index values and band outcomes remain comparable; the per-criterion labels
  follow the renumbered scale. The frozen v1-alpha catalog lineage remains
  separate and is not the current model source.
  The model's existing derived-from relationship to dea:maturity-operations
  is preserved. Its touchpoints.yaml contains the AO-side mirror record
  tp-autonomous-operations-x-operations and remains draft against
  maturity-touchpoint-contract@0.1.0-draft. The typed root-manifest declaration
  and explicit peer-side mirror pointer are proposed in
  maturity-model-autonomous-operations#12 and maturity-model-operations#13.
  The registered immutable SHA above predates those source changes; a follow-on
  versioned release and registry-reference update will be required before the
  typed declaration and reciprocal peer pointer are part of a registry-pinned
  release.
