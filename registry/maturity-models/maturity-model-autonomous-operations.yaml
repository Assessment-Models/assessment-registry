notes: >-
  Release 2.0.1 (2026-11-23) is pinned to immutable commit
  75795a1e23e90edcfa268737e511fa16fcfc18eb, the merge commit for the
  versioned 2.0.1 release. The commit has been verified in the source
  repository; no v2.0.1 tag exists, so the registry uses the permitted
  immutable commit reference rather than inventing a tag.
  This release includes the typed root-manifest declaration for the existing
  AO-to-Operations touchpoint artifact. At the pinned release, touchpoints.yaml
