id: maturity-model-autonomous-operations
asset_class: assessment
type: maturity-model
name: Autonomous Operations Maturity Model
description: >-
  Autonomous Operations (AO) maturity and assessment model: the enterprise operating
  model in which value streams are instrumented with AI, data and closed-loop control;
  OODA (Observe-Orient-Decide-Act) closed loops driven by intent/goals shift decision and
  execution burden from humans to machines. Five levels on the canonical v2 bands with
  ambition-driving AO stages (Manual & Reactive, Instrumented & Assisted, Closed-Loop
  Automated, Goal-Driven Autonomy, Self-Improving Ecosystem); AO Autonomy Index 0-100
  scoring with weakest-link gate and effort-adjusted value; 6 dimensions / 32
  sub-dimensions / 157 criteria; assessment method with evidence pack, assessor
  independence and confidence levels.
