# Registration record for the legacy v1-alpha operations assessment instrument.
id: dea-assessment-operations
asset_class: assessment
type: assessment-model
name: Operations Assessment (legacy v1-alpha)
description: >-
  EA assessment instrument for the operations domain: incident response,
  observability, deployment automation, SLOs, SRE practices. 5 dimensions,
  20 questions, facilitated. Scores against dea:maturity-operations in the
  legacy dea-catalog-maturity-models catalog.
source:
  organization: Assessment-Models
  repository: dea-assessment-operations
release:
  version: 1.1.0-alpha
  reference: v1.1.0-alpha
  commit: e012695e10f573049d8da2ed8b3aa50097e7ea50
conformsTo:
  contract:
    id: opendea-assessment-metamodel
    version: "1.0"
status: active
dependencies:
  - dea-catalog-assessment-tools
  - dea-catalog-maturity-models
notes: >-
  CR-AM-01 Release 1 decision D-1/D-3 (freeze legacy cluster):
  this instrument deliberately scores against the frozen v1-alpha
  maturity scheme (status: legacy). The v2 migration path per domain is
  an independent maturity-model-* repository anchored on the v2
  canonical architecture (CR-AM-09); see
  dea-catalog-assessment-tools/change-requests/
  CR-AM-01-release-1-decision.md. No tags exist on the source
  repository; the immutable reference is the main-tip commit SHA at
  registration time. Porting to the federated contract handshake
  (model.yaml, Level 1/2 CI) is Phase 2 work of the integration plan.
